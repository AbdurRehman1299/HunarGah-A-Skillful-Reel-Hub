name: Hunargah CI/CD Pipeline

on:
  push:
    branches["main"]
  pull_request:
    branches["main"]

jobs:
  build:
    runs_on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Extract App version
        id: extract_version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "APP_VERSION=$version" >> $GITHUB_ENV

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Hunargah-v${{ env.APP_VERSION }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Hunargah-v${{ env.APP_VERSION }}
          path: build/app/outputs/flutter-apk/Hunargah-v${{ env.APP_VERSION }}.apk